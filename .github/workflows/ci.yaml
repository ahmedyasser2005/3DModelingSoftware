name: CI Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build Application Targets
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Verify Build Output and Stage Binaries
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path ${{github.workspace}}\ship
        Copy-Item -Path "${{github.workspace}}\build\Release\*" -Destination "${{github.workspace}}\ship\" -Recurse -Force
        Compress-Archive -Path "${{github.workspace}}\ship\*" -DestinationPath "${{github.workspace}}\Software.zip"

    - name: Create GitHub Release and Upload Assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{github.workspace}}/build-output.zip
        body: "Automated early version release for ${{ github.ref_name }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
